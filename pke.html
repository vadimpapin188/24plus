<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#071426">
<title>Погодный канал Евразии</title>
<style>
:root{--bg:#061426;--panel:#102b49;--gold:#e8bd59;--white:#f5f8fc;--muted:#a9bbcf;--line:#ffffff20}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(ellipse at 50% 20%,#24527a 0,transparent 48%),linear-gradient(145deg,#061426,#0b2039 65%,#071426)}
#screen{height:100%;display:flex;flex-direction:column;position:relative;isolation:isolate}
#screen:before,#screen:after{content:"";position:absolute;z-index:-1;border:1px solid #ffffff0b;border-radius:50%;width:65vw;height:65vw;max-width:850px;max-height:850px;left:50%;top:52%;transform:translate(-50%,-50%)}
#screen:after{width:90vw;height:90vw;max-width:1200px;max-height:1200px}
header{height:94px;flex:none;display:flex;align-items:center;padding:12px clamp(16px,4vw,56px);border-bottom:1px solid var(--line);background:#061326a8;gap:16px}
.country-box{min-width:0;display:flex;flex-direction:column;gap:5px}
.kicker{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:800;text-transform:uppercase}
#country{font-size:clamp(17px,2.2vw,25px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#region{font-size:12px;color:var(--muted)}
.logo{margin-left:auto;width:clamp(54px,7vw,82px);height:clamp(54px,7vw,82px);object-fit:contain;margin-right: 110px;}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px 18px 30px}
#eyebrow{color:var(--gold);font-size:clamp(10px,1.2vw,13px);font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:15px}
#city{font-size:clamp(30px,6vw,66px);font-weight:800;letter-spacing:-1.5px;margin:0 0 12px}
#condition{font-size:clamp(16px,2vw,23px);color:#d5e1ed;margin-bottom:20px}
.weather-row{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,24px)}
#icon{width:clamp(82px,12vw,140px);height:clamp(82px,12vw,140px);object-fit:contain;filter:drop-shadow(0 8px 20px #0005)}
#temp{font-size:clamp(66px,12vw,132px);font-weight:300;line-height:1;letter-spacing:-5px}
.details{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:25px}
.detail{min-width:125px;padding:13px 17px;border:1px solid var(--line);background:#102b49a8;border-radius:14px;text-align:left}
.detail-label{font-size:10px;color:var(--muted);letter-spacing:1.3px;text-transform:uppercase;margin-bottom:7px}
.detail-value{font-size:18px;font-weight:700}
#status{margin-top:23px;font-size:12px;color:var(--muted);min-height:16px}
footer{flex:none;min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px clamp(14px,3vw,40px);border-top:1px solid var(--line);background:#061326a8;color:var(--muted);font-size:12px}
#clock{font-variant-numeric:tabular-nums;color:var(--white);font-weight:700;font-size:15px;white-space:nowrap}
.controls{display:flex;align-items:center;gap:8px}
button{border:1px solid #ffffff35;background:#102b49;color:var(--white);border-radius:9px;padding:9px 13px;font-size:14px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--gold);outline:none;background:#1b4166}
#counter{min-width:55px;text-align:center;font-variant-numeric:tabular-nums}
.brand{white-space:nowrap}
@media(max-width:600px){header{height:76px}.details{gap:7px}.detail{min-width:calc(50% - 7px);padding:10px 12px}.detail-value{font-size:16px}footer{flex-wrap:wrap;justify-content:center;text-align:center}.brand{display:none}#status{margin-top:15px}}
</style>
</head>
<body>
<div id="screen">
  <header>
    <div class="country-box">
      <div class="kicker">Погодный канал Евразии · Сейчас</div>
      <div id="country">ЗАГРУЗКА</div>
      <div id="region">Подключение к метеослужбе…</div>
    </div>
    <img class="logo" src="pke_logo.png" alt="Логотип Погодного канала Евразии">
  </header>
  <main>
    <div id="eyebrow">ПОГОДА ЕВРАЗИИ</div>
    <h1 id="city">Загружаем прогноз</h1>
    <div id="condition">Получаем текущие погодные данные</div>
    <div class="weather-row">
      <img id="icon" alt="" src="">
      <div id="temp">—°</div>
    </div>
    <div class="details">
      <div class="detail"><div class="detail-label">Ощущается как</div><div class="detail-value" id="feels">—</div></div>
      <div class="detail"><div class="detail-label">Ветер</div><div class="detail-value" id="wind">—</div></div>
      <div class="detail"><div class="detail-label">Влажность</div><div class="detail-value" id="humidity">—</div></div>
      <div class="detail"><div class="detail-label">Давление</div><div class="detail-value" id="pressure">—</div></div>
    </div>
    <div id="status" aria-live="polite">Ожидание данных…</div>
  </main>
  <footer>
    <div class="brand">24 Плюс · Телевидение Евразии</div>
    <div class="controls">
      <button id="prev" type="button" aria-label="Предыдущий город">◀</button>
      <span id="counter">— / —</span>
      <button id="next" type="button" aria-label="Следующий город">▶</button>
    </div>
    <div id="clock">--:--:--</div>
  </footer>
</div>
<script>
(() => {
  // ВСТАВЬ СЮДА СВОЙ КЛЮЧ OpenWeatherMap МЕЖДУ КАВЫЧКАМИ.
  const API_KEY = "0e13121a7e5aae1124eb85a45db0de4c";

  // Города выбраны как представители регионов и стран. Список можно расширять.
  const places = [
    // Казахстан
    {city:"Pavlodar", label:"Павлодар", country:"КАЗАХСТАН", region:"Павлодарская область", code:"KZ"},
    {city:"Astana", label:"Астана", country:"КАЗАХСТАН", region:"Акмолинская область", code:"KZ"},
    {city:"Almaty", label:"Алматы", country:"КАЗАХСТАН", region:"Алматинский регион", code:"KZ"},
    {city:"Shymkent", label:"Шымкент", country:"КАЗАХСТАН", region:"Южный Казахстан", code:"KZ"},
    {city:"Karaganda", label:"Караганда", country:"КАЗАХСТАН", region:"Карагандинская область", code:"KZ"},
    {city:"Aktobe", label:"Актобе", country:"КАЗАХСТАН", region:"Актюбинская область", code:"KZ"},
    {city:"Atyrau", label:"Атырау", country:"КАЗАХСТАН", region:"Атырауская область", code:"KZ"},
    {city:"Oskemen", label:"Усть-Каменогорск", country:"КАЗАХСТАН", region:"Восточно-Казахстанская область", code:"KZ"},
    // Россия
    {city:"Moscow", label:"Москва", country:"РОССИЯ", region:"Центральный федеральный округ", code:"RU"},
    {city:"Saint Petersburg", label:"Санкт-Петербург", country:"РОССИЯ", region:"Северо-Западный федеральный округ", code:"RU"},
    {city:"Novosibirsk", label:"Новосибирск", country:"РОССИЯ", region:"Сибирский федеральный округ", code:"RU"},
    {city:"Yekaterinburg", label:"Екатеринбург", country:"РОССИЯ", region:"Уральский федеральный округ", code:"RU"},
    {city:"Omsk", label:"Омск", country:"РОССИЯ", region:"Сибирский федеральный округ", code:"RU"},
    {city:"Kazan", label:"Казань", country:"РОССИЯ", region:"Республика Татарстан", code:"RU"},
    {city:"Sochi", label:"Сочи", country:"РОССИЯ", region:"Краснодарский край", code:"RU"},
    {city:"Vladivostok", label:"Владивосток", country:"РОССИЯ", region:"Дальний Восток", code:"RU"},
    // Беларусь
    {city:"Minsk", label:"Минск", country:"БЕЛАРУСЬ", region:"Минская область", code:"BY"},
    {city:"Brest", label:"Брест", country:"БЕЛАРУСЬ", region:"Брестская область", code:"BY"},
    {city:"Gomel", label:"Гомель", country:"БЕЛАРУСЬ", region:"Гомельская область", code:"BY"},
    // Китай
    {city:"Beijing", label:"Пекин", country:"КИТАЙ", region:"Северный Китай", code:"CN"},
    {city:"Shanghai", label:"Шанхай", country:"КИТАЙ", region:"Восточный Китай", code:"CN"},
    {city:"Urumqi", label:"Урумчи", country:"КИТАЙ", region:"Синьцзян-Уйгурский автономный район", code:"CN"},
    {city:"Harbin", label:"Харбин", country:"КИТАЙ", region:"Северо-Восточный Китай", code:"CN"},
    // Европа
    {city:"London", label:"Лондон", country:"ВЕЛИКОБРИТАНИЯ", region:"Англия", code:"GB"},
    {city:"Paris", label:"Париж", country:"ФРАНЦИЯ", region:"Иль-де-Франс", code:"FR"},
    {city:"Berlin", label:"Берлин", country:"ГЕРМАНИЯ", region:"Берлин", code:"DE"},
    {city:"Rome", label:"Рим", country:"ИТАЛИЯ", region:"Лацио", code:"IT"},
    {city:"Madrid", label:"Мадрид", country:"ИСПАНИЯ", region:"Сообщество Мадрид", code:"ES"},
    {city:"Warsaw", label:"Варшава", country:"ПОЛЬША", region:"Мазовецкое воеводство", code:"PL"},
    {city:"Prague", label:"Прага", country:"ЧЕХИЯ", region:"Прага", code:"CZ"},
    {city:"Vienna", label:"Вена", country:"АВСТРИЯ", region:"Вена", code:"AT"},
    {city:"Helsinki", label:"Хельсинки", country:"ФИНЛЯНДИЯ", region:"Уусимаа", code:"FI"},
    {city:"Stockholm", label:"Стокгольм", country:"ШВЕЦИЯ", region:"Стокгольм", code:"SE"},
    {city:"Oslo", label:"Осло", country:"НОРВЕГИЯ", region:"Осло", code:"NO"},
    {city:"Athens", label:"Афины", country:"ГРЕЦИЯ", region:"Аттика", code:"GR"},
    {city:"Bucharest", label:"Бухарест", country:"РУМЫНИЯ", region:"Бухарест", code:"RO"},
    {city:"Budapest", label:"Будапешт", country:"ВЕНГРИЯ", region:"Будапешт", code:"HU"},
    {city:"Tbilisi", label:"Тбилиси", country:"ГРУЗИЯ", region:"Тбилиси", code:"GE"},
    {city:"Yerevan", label:"Ереван", country:"АРМЕНИЯ", region:"Ереван", code:"AM"},
    {city:"Baku", label:"Баку", country:"АЗЕРБАЙДЖАН", region:"Абшерон", code:"AZ"}
  ];



  const CACHE_REFRESH_MS = 2 * 60 * 60 * 1000; // обновлять данные не чаще раза в 2 часа
  const SLIDE_MS = 5000; // смена города каждые 12 секунд
  const cache = new Map();
  let index = 0;
  let slideTimer = null;
  let refreshTimer = null;
  let loading = false;

  const $ = id => document.getElementById(id);
  const countryEl = $("country"), regionEl = $("region"), cityEl = $("city");
  const conditionEl = $("condition"), tempEl = $("temp"), iconEl = $("icon");
  const feelsEl = $("feels"), windEl = $("wind"), humidityEl = $("humidity"), pressureEl = $("pressure");
  const statusEl = $("status"), counterEl = $("counter");

  function weatherText(text) {
    const map = {
      "clear sky":"ясно", "few clouds":"небольшая облачность", "scattered clouds":"переменная облачность",
      "broken clouds":"облачно с прояснениями", "overcast clouds":"пасмурно", "shower rain":"ливень",
      "light rain":"небольшой дождь", "moderate rain":"дождь", "heavy intensity rain":"сильный дождь",
      "rain":"дождь", "thunderstorm":"гроза", "snow":"снег", "light snow":"небольшой снег",
      "mist":"дымка", "fog":"туман", "haze":"мгла", "drizzle":"морось", "smoke":"дым"
    };
    return map[text] || text || "Нет описания";
  }

  function renderPlace(place, data) {
    countryEl.textContent = place.country;
    regionEl.textContent = place.region;
    cityEl.textContent = place.label;
    counterEl.textContent = `${index + 1} / ${places.length}`;
    if (!data) {
      conditionEl.textContent = "Ожидаем погодные данные";
      tempEl.textContent = "—°";
      iconEl.removeAttribute("src");
      feelsEl.textContent = windEl.textContent = humidityEl.textContent = pressureEl.textContent = "—";
      statusEl.textContent = "Данные для этого города пока не загружены";
      return;
    }
    conditionEl.textContent = weatherText(data.weather?.[0]?.description);
    tempEl.textContent = `${Math.round(data.main.temp)}°`;
    const icon = data.weather?.[0]?.icon;
    iconEl.src = icon ? `https://openweathermap.org/img/wn/${icon}@4x.png` : "";
    feelsEl.textContent = `${Math.round(data.main.feels_like)}°C`;
    windEl.textContent = `${Math.round((data.wind?.speed || 0) * 3.6)} км/ч`;
    humidityEl.textContent = `${data.main.humidity}%`;
    pressureEl.textContent = `${data.main.pressure} гПа`;
    const updated = new Date(data._loadedAt || Date.now());
    statusEl.textContent = `Данные OpenWeatherMap · обновлено ${updated.toLocaleTimeString("ru-RU", {hour:"2-digit",minute:"2-digit"})}`;
  }

  async function fetchPlace(place) {
    if (!API_KEY || API_KEY === "ВСТАВЬ_СЮДА_API_КЛЮЧ") return null;
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(place.city)},${place.code}&appid=${encodeURIComponent(API_KEY)}&units=metric&lang=ru`;
    const response = await fetch(url);
    if (!response.ok) {
      let message = `HTTP ${response.status}`;
      try { const error = await response.json(); if (error.message) message = error.message; } catch (_) {}
      throw new Error(message);
    }
    const data = await response.json();
    data._loadedAt = Date.now();
    cache.set(place.city, data);
    return data;
  }

  async function showCurrentPlace() {
    const place = places[index];
    renderPlace(place, cache.get(place.city));
    const cached = cache.get(place.city);
    if (cached && Date.now() - cached._loadedAt < CACHE_REFRESH_MS) return;
    if (!API_KEY || API_KEY === "ВСТАВЬ_СЮДА_API_КЛЮЧ") {
      statusEl.textContent = "Вставь API-ключ OpenWeatherMap в переменную API_KEY внизу файла";
      return;
    }
    try {
      statusEl.textContent = "Обновляем погоду…";
      const data = await fetchPlace(place);
      if (places[index] === place) renderPlace(place, data);
    } catch (error) {
      console.warn("Weather API error:", place.city, error);
      if (places[index] === place) {
        statusEl.textContent = `Не удалось получить данные: ${error.message}`;
        if (!cached) conditionEl.textContent = "Временно нет данных";
      }
    }
  }

  function go(step) {
    index = (index + step + places.length) % places.length;
    showCurrentPlace();
  }

  function startSlides() {
    clearInterval(slideTimer);
    slideTimer = setInterval(() => go(1), SLIDE_MS);
  }

  // Последовательная фоновая загрузка всех городов с паузой между запросами.
  async function refreshAll() {
    if (loading || !API_KEY || API_KEY === "ВСТАВЬ_СЮДА_API_КЛЮЧ") return;
    loading = true;
    for (const place of places) {
      const cached = cache.get(place.city);
      if (!cached || Date.now() - cached._loadedAt >= CACHE_REFRESH_MS) {
        try { await fetchPlace(place); }
        catch (error) { console.warn("Не удалось обновить", place.label, error.message); }
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
    }
    loading = false;
    showCurrentPlace();
  }

  function updateClock() {
    const now = new Date();
    $("clock").textContent = now.toLocaleTimeString("ru-RU", {hour:"2-digit",minute:"2-digit",second:"2-digit"});
  }

  $("prev").addEventListener("click", () => go(-1));
  $("next").addEventListener("click", () => go(1));
  document.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft") go(-1);
    if (event.key === "ArrowRight") go(1);
  });

  function showRandomCity() {
    const randomIndex = Math.floor(Math.random() * places.length);
    index = randomIndex;
    showCurrentPlace();
}

  updateClock();
  setInterval(updateClock, 1000);
  renderPlace(places[index], null);
  showCurrentPlace();
  startSlides();
  refreshAll();
    showRandomCity();
  refreshTimer = setInterval(refreshAll, 10 * 60 * 1000);
})();
</script>
</body>
</html>
